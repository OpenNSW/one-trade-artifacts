name: Validate static-data fields

# Every pull request runs it, as branch protection can require its result.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "**/*.json"
      - ".github/scripts/check_static_data_fields.py"
      - ".github/workflows/validate-static-data-fields.yml"

permissions:
  contents: read

jobs:
  validate:
    # A name of its own: other workflows' jobs are called validate too, and branch
    # protection requires a check by name.
    name: Static-data fields fit the static data they name
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check each field's template and searchKeys against its static data
        run: python .github/scripts/check_static_data_fields.py
