name: Validate task roles

# Every pull request runs it, as branch protection requires its result.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "tnsw/**"
      - "*/manifest.json"
      - "cda/**"
      - "efc/**"
      - "fcau/**"
      - "npqs/**"
      - "sltb/**"
      - ".github/scripts/check_agency_authz.py"
      - ".github/workflows/validate-agency-authz.yml"

permissions:
  contents: read

jobs:
  validate:
    # A name of its own: other workflows' jobs are called validate too, and branch
    # protection requires a check by name.
    name: Every task declares who may act and read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check every task declares who may act and read
        run: python .github/scripts/check_agency_authz.py
