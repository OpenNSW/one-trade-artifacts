name: Release artifacts

# Publishes bundles from a tag with scripts/release_manifest.py, which adds the
# next immutable manifest_vN.json and never overwrites or deletes.
#
# The destination comes from the chosen GitHub environment, never from an
# input, so a dispatch can't send the store's credentials elsewhere:
#   vars.S3_ENDPOINT_URL         endpoint of the S3-compatible store (empty for AWS S3)
#   vars.S3_BUCKET               bucket
#   vars.S3_PREFIX               optional; each bundle goes to <prefix>/<bundle>
#   vars.S3_REGION               optional; defaults to "auto" with an endpoint
#   secrets.S3_ACCESS_KEY_ID     credentials with read and write access to the bucket
#   secrets.S3_SECRET_ACCESS_KEY
# Each bundle is released to s3://<bucket>/[<prefix>/]<bundle>, which is where
# the backend's artifact loader (its s3.prefix) must point.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment holding the destination store"
        type: environment
        required: true
      tag:
        description: "Tag to release; empty for the newest"
        type: string
        default: ""
      bundles:
        description: "Bundles to release, space-separated; empty for every top-level folder with a manifest.json"
        type: string
        default: ""
      dry_run:
        description: "Show what would be published and write nothing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out the tag
        id: tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git fetch origin --tags --force
          TAG="${TAG:-$(git tag --sort=-creatordate | head -n1)}"
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null \
            || { echo "::error::tag '$TAG' does not exist"; exit 1; }
          git checkout --quiet --detach "refs/tags/$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG ($(git log -1 --format='%h %s'))"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install boto3
        # 1.36 added the checksum settings the script turns off for S3-compatible stores.
        run: python -m pip install 'boto3>=1.36'

      - name: Release
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL: ${{ vars.S3_ENDPOINT_URL }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_PREFIX: ${{ vars.S3_PREFIX }}
          S3_REGION: ${{ vars.S3_REGION }}
          BUNDLES: ${{ inputs.bundles }}
          DRY_RUN: ${{ inputs.dry_run }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [ -n "$S3_BUCKET" ] || fail "set S3_BUCKET on the environment"
          [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ] \
            || fail "set S3_ACCESS_KEY_ID and S3_SECRET_ACCESS_KEY on the environment"

          if [ -z "$BUNDLES" ]; then
            BUNDLES="$(for m in */manifest.json; do dirname "$m"; done)"
          fi
          for b in $BUNDLES; do
            [[ "$b" =~ ^[a-z0-9-]+$ && -f "$b/manifest.json" ]] \
              || fail "'$b' is not a top-level folder with a manifest.json at $TAG"
          done

          args=()
          [ -n "$S3_ENDPOINT_URL" ] && args+=(--endpoint-url "$S3_ENDPOINT_URL")
          [ -n "$S3_REGION" ] && args+=(--region "$S3_REGION")
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); else args+=(--yes); fi
          prefix="${S3_PREFIX#/}"; prefix="${prefix%/}"

          {
            echo "### Release $TAG$([ "$DRY_RUN" = true ] && echo ' (dry run)')"
            echo
            echo "| Bundle | Destination | Version | Published | Changed | Removed | Uploaded |"
            echo "| --- | --- | --- | --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          for b in $BUNDLES; do
            dest="s3://$S3_BUCKET/${prefix:+$prefix/}$b"
            echo "::group::$b -> $dest"
            out="$RUNNER_TEMP/$b.json"
            python3 scripts/release_manifest.py "$b" --dest "$dest" "${args[@]}" --json > "$out"
            echo "::endgroup::"
            jq -r '"| \(.bundle) | \(.dest) | v\(.version) | \(.published) | \(.changed | length) | \(.removed | length) | \(.uploaded) |"' \
              "$out" >> "$GITHUB_STEP_SUMMARY"
          done
