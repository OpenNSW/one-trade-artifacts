name: Test release builder

on:
  pull_request:
    paths:
      - "scripts/build_release.py"
      - "scripts/test_build_release.py"
      - ".github/workflows/test-release-builder.yml"
  push:
    branches: [main]
    paths:
      - "scripts/build_release.py"
      - "scripts/test_build_release.py"
      - ".github/workflows/test-release-builder.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run the release builder's tests
        run: python3 -m unittest discover -s scripts -p 'test_build_release.py' -v
